name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  plan:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.state.outputs.version }}
      source: ${{ steps.state.outputs.source }}
      work: ${{ steps.state.outputs.work }}
      existing: ${{ steps.state.outputs.existing }}
      stage: ${{ steps.state.outputs.stage }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - id: state
        env:
          GH_TOKEN: ${{ github.token }}
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: node scripts/release.mjs state

  qualify:
    needs: plan
    if: needs.plan.outputs.work == 'true'
    uses: ./.github/workflows/quality.yml
    with:
      source: ${{ needs.plan.outputs.source }}
      reuse-release: ${{ needs.plan.outputs.existing == 'true' }}
      artifact-name: release-candidate

  release:
    needs: [plan, qualify]
    if: needs.plan.outputs.work == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      id-token: write
    env:
      VERSION: ${{ needs.plan.outputs.version }}
      SOURCE: ${{ needs.plan.outputs.source }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.plan.outputs.source }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          registry-url: https://registry.npmjs.org
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-candidate
          path: ${{ runner.temp }}/candidate
      - run: node scripts/release.mjs verify "$RUNNER_TEMP/candidate" "$VERSION" "$SOURCE"
      - if: needs.plan.outputs.existing != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          cd "$RUNNER_TEMP/candidate"
          cp greatping.tgz "greatping-$VERSION.tgz"
          flags=(--latest)
          if [[ "$VERSION" == *-* ]]; then flags=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$SOURCE"             --title "greatping $VERSION" --generate-notes "${flags[@]}"             greatping.tgz "greatping-$VERSION.tgz" release.json SHA256SUMS
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/v$VERSION" --jq .immutable)" = true
          echo "Immutable GitHub assets published for greatping@$VERSION; npm approval is separate." >> "$GITHUB_STEP_SUMMARY"
      - if: needs.plan.outputs.stage == 'true'
        run: npm install --global npm@11.21.0 --ignore-scripts
      - if: needs.plan.outputs.stage == 'true'
        shell: bash
        run: |
          tag=latest
          if [[ "$VERSION" == *-* ]]; then tag=next; fi
          # Submit the checked tarball directly. Do not unpack/repack or rebuild.
          # Failures (including an existing stage) stay failures until inspected;
          # an arbitrary error containing 'already' must never become success.
          npm stage publish "$RUNNER_TEMP/candidate/greatping.tgz"             --access public --provenance --ignore-scripts --tag "$tag"
          echo "greatping@$VERSION staged. Review its integrity against release.json, then approve with npm 2FA." >> "$GITHUB_STEP_SUMMARY"
      - if: needs.plan.outputs.stage != 'true'
        run: echo "npm staging is disabled (NPM_PUBLISH != true). No npm package was submitted." >> "$GITHUB_STEP_SUMMARY"
