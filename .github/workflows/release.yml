name: Release

# Releases the CLI whenever apps/cli/package.json carries a version that has
# no tag yet. Versions are bumped in the internal monorepo and arrive here
# with the sync.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then
            echo "new=false" >> "$GITHUB_OUTPUT"
          else
            echo "new=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.version.outputs.new == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.version.outputs.new == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.version.outputs.new == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          cd apps/cli
          pnpm pack --out ../../greatping-${{ steps.version.outputs.version }}.tgz
          cp ../../greatping-${{ steps.version.outputs.version }}.tgz ../../greatping.tgz
      - if: steps.version.outputs.new == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Only versions like 1.2.0-beta.1 are pre-releases; releases/latest
          # (the install link in the README) never points at one.
          case "$VERSION" in
            *-*) flags="--prerelease" ;;
            *) flags="--latest" ;;
          esac
          gh release create "v$VERSION" "greatping-$VERSION.tgz" greatping.tgz \
            --title "greatping $VERSION" --generate-notes $flags
      # npm publishing starts once an NPM_TOKEN secret exists; provenance links
      # the package to this workflow run.
      - if: steps.version.outputs.new == 'true'
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -z "$NODE_AUTH_TOKEN" ]; then
            echo "NPM_TOKEN is not set; skipping npm publish."
            exit 0
          fi
          npm publish "greatping-$VERSION.tgz" --access public --provenance
