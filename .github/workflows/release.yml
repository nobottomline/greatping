name: Release

# Releases the CLI for the version in apps/cli/package.json. Versions are
# bumped in the internal monorepo and arrive here with the sync. The GitHub
# release and the npm package are checked separately, so a step that failed
# or was skipped is completed by the next run.
#
# npm releases are staged, not published: trusted publishing (OIDC, no stored
# token) lets only this workflow submit a version, and it goes live only after
# a maintainer approves it with two-factor authentication on npmjs.com or with
# `npm stage approve <id>`. A compromised repository or workflow therefore
# cannot ship a version on its own. Staging runs once the repository variable
# NPM_PUBLISH is "true".
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: state
        env:
          NPM_PUBLISH: ${{ vars.NPM_PUBLISH }}
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse "v$version" >/dev/null 2>&1; then tagged=true; else tagged=false; fi
          echo "tagged=$tagged" >> "$GITHUB_OUTPUT"
          if npm view "greatping@$version" version >/dev/null 2>&1; then
            on_npm=true
          else
            on_npm=false
          fi
          if [ "$on_npm" = false ] && [ "$NPM_PUBLISH" != true ]; then
            echo "NPM_PUBLISH is not true; greatping@$version will not be published to npm."
          fi
          publish=$([ "$on_npm" = false ] && [ "$NPM_PUBLISH" = true ] && echo true || echo false)
          echo "publish=$publish" >> "$GITHUB_OUTPUT"
          work=$([ "$tagged" = false ] || [ "$publish" = true ] && echo true || echo false)
          echo "work=$work" >> "$GITHUB_OUTPUT"
      - if: steps.state.outputs.work == 'true'
        uses: pnpm/action-setup@v4
      - if: steps.state.outputs.work == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - if: steps.state.outputs.work == 'true'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
          cd apps/cli
          pnpm pack --out "../../greatping-$VERSION.tgz"
          cp "../../greatping-$VERSION.tgz" ../../greatping.tgz
      - if: steps.state.outputs.work == 'true' && steps.state.outputs.tagged == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          # Only versions like 1.2.0-beta.1 are pre-releases; releases/latest
          # (the install link in the README) never points at one.
          case "$VERSION" in
            *-*) flags="--prerelease" ;;
            *) flags="--latest" ;;
          esac
          gh release create "v$VERSION" "greatping-$VERSION.tgz" greatping.tgz \
            --title "greatping $VERSION" --generate-notes $flags
      # Staging needs npm 11.15 or later; provenance links the package to this
      # workflow run and commit. The exact tarball of the GitHub release is
      # staged, from its unpacked directory.
      - if: steps.state.outputs.publish == 'true'
        env:
          VERSION: ${{ steps.state.outputs.version }}
        run: |
          npm install --global npm@latest
          case "$VERSION" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          mkdir -p staged && tar -xzf "greatping-$VERSION.tgz" -C staged
          if npm stage publish ./staged/package --access public --provenance --tag "$tag" 2>&1 | tee stage.log; then
            echo "::notice::greatping@$VERSION is staged. Approve it on npmjs.com or with npm stage approve."
          elif grep -qE "E409|already" stage.log; then
            echo "::notice::greatping@$VERSION is already staged and waits for approval."
          else
            exit 1
          fi
