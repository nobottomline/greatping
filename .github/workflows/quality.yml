name: Qualify CLI archive

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''
      reuse-release:
        type: boolean
        default: false
      artifact-name:
        type: string
        default: cli-candidate

permissions:
  contents: read

jobs:
  build:
    name: Build and check source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm plugins:check
      - run: pnpm lint
      - run: bash scripts/quality/install-gitleaks.sh
      - run: pnpm secrets
      - run: pnpm test:quality
      - run: pnpm typecheck
      - run: node --test scripts/*.test.mjs
      - run: pnpm test
      - run: pnpm build
      - id: identity
        shell: bash
        run: |
          echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/candidate"
      - name: Bundle the simulated phone for clean archive runners
        run: pnpm -F greatping exec tsdown --config test/tsdown.fixture.config.ts --out-dir "$RUNNER_TEMP/candidate/fixtures"
      - if: ${{ !inputs.reuse-release }}
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE: ${{ steps.identity.outputs.source }}
        run: |
          pnpm -F greatping pack --out "$RUNNER_TEMP/candidate/greatping.tgz"
          node scripts/release.mjs record "$RUNNER_TEMP/candidate" "$VERSION" "$SOURCE"
      - if: inputs.reuse-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY"             --pattern greatping.tgz --pattern release.json --pattern SHA256SUMS             --dir "$RUNNER_TEMP/candidate"
      - shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE: ${{ steps.identity.outputs.source }}
        run: node scripts/release.mjs verify "$RUNNER_TEMP/candidate" "$VERSION" "$SOURCE"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Installed CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: ['22.20.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      # Unix suites import source helpers to inspect state and simulate a phone.
      # Prepare those locked test dependencies on the build runtime. The CLI
      # under test is still installed separately from the downloaded archive;
      # package-smoke asserts that installation has no workspace protocol/tooling.
      - if: runner.os != 'Windows'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - if: runner.os != 'Windows'
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/candidate
      - shell: bash
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          node scripts/release.mjs verify "$RUNNER_TEMP/candidate" "$version" "$(git rev-parse HEAD)"
      - if: runner.os != 'Windows'
        shell: bash
        env:
          GREATPING_TEST_PAIRING_FIXTURE: ${{ runner.temp }}/candidate/fixtures/pairing-fetch.mjs
        run: node apps/cli/test/package-smoke.mjs "$RUNNER_TEMP/candidate/greatping.tgz"
      # Unix PTY and mock-host suites do not qualify native Windows hooks.
      # Windows checks installation, the npm launcher and offline commands.
      - if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $installation = Join-Path $env:RUNNER_TEMP 'cli-install'
          # setup-node's versioned cache is deliberately rejected as a durable
          # plugin launcher. Use a stable fixture path for this exact matrix
          # runtime, as a normal installed runtime/shim provides for users.
          $runtime = Join-Path $env:RUNNER_TEMP 'cli-runtime'
          New-Item -ItemType Directory -Force $runtime | Out-Null
          Copy-Item (Get-Command node.exe).Source (Join-Path $runtime 'node.exe')
          $env:PATH = "$runtime;$env:PATH"
          $env:HOME = Join-Path $env:RUNNER_TEMP 'cli-home'
          $env:USERPROFILE = $env:HOME
          $env:APPDATA = Join-Path $env:HOME 'AppData/Roaming'
          $env:XDG_CONFIG_HOME = Join-Path $env:HOME '.config'
          $env:CODEX_HOME = Join-Path $env:HOME '.codex'
          New-Item -ItemType Directory -Force $env:HOME | Out-Null
          npm install --prefix $installation --ignore-scripts --no-audit --no-fund --package-lock=false "$env:RUNNER_TEMP/candidate/greatping.tgz"
          if ($LASTEXITCODE -ne 0) { throw 'Package installation failed' }
          $launcher = Join-Path $installation 'node_modules/.bin/greatping.cmd'
          $package = Get-Content (Join-Path $installation 'node_modules/greatping/package.json') | ConvertFrom-Json
          $version = & $launcher --version
          if ($LASTEXITCODE -ne 0 -or $version.Trim() -ne $package.version) { throw 'npm launcher/version failed' }
          & $launcher --help
          if ($LASTEXITCODE -ne 0) { throw 'Help failed' }
          $plan = & $launcher uninstall --dry-run --json
          if ($LASTEXITCODE -ne 0) { throw 'Offline uninstall plan failed' }
          $plan | ConvertFrom-Json | Out-Null
          if (Test-Path "$env:XDG_CONFIG_HOME/greatping/config.json") { throw 'Dry-run wrote a credential' }
          & $launcher setup opencode --yes
          if ($LASTEXITCODE -ne 0) { throw 'Offline native adapter setup failed' }
          $state = (& $launcher status --json) | ConvertFrom-Json
          if ($LASTEXITCODE -ne 1) { throw 'Expected unpaired status' }
          $adapter = $state.plugins | Where-Object { $_.id -eq 'opencode' }
          if ($adapter.status -ne 'ready') { throw 'Native adapter inventory failed' }
          & $launcher setup opencode --remove --yes
          if ($LASTEXITCODE -ne 0) { throw 'Native adapter removal failed' }
          if (Test-Path "$env:XDG_CONFIG_HOME/opencode/plugins/greatping.js") { throw 'Native entrypoint remains' }
          if (Test-Path "$env:XDG_CONFIG_HOME/greatping/config.json") { throw 'Native setup wrote a credential' }
