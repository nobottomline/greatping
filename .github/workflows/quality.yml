name: Qualify CLI archive

on:
  workflow_call:
    inputs:
      source:
        type: string
        default: ''
      reuse-release:
        type: boolean
        default: false
      artifact-name:
        type: string
        default: cli-candidate

permissions:
  contents: read

jobs:
  build:
    name: Build and check source
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm plugins:check
      - run: pnpm lint
      - run: bash scripts/quality/install-gitleaks.sh
      - run: pnpm secrets
      - run: pnpm test:quality
      - run: pnpm typecheck
      - run: node --test scripts/*.test.mjs
      - run: pnpm test
      - run: pnpm build
      - id: identity
        shell: bash
        run: |
          echo "version=$(node -p "require('./apps/cli/package.json').version")" >> "$GITHUB_OUTPUT"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/candidate"
      - name: Bundle the simulated phone for clean archive runners
        run: pnpm -F greatping exec tsdown --config test/tsdown.fixture.config.ts --out-dir "$RUNNER_TEMP/candidate/fixtures"
      - if: ${{ !inputs.reuse-release }}
        shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE: ${{ steps.identity.outputs.source }}
        run: |
          pnpm -F greatping pack --out "$RUNNER_TEMP/candidate/greatping.tgz"
          node scripts/release.mjs record "$RUNNER_TEMP/candidate" "$VERSION" "$SOURCE"
      - if: inputs.reuse-release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.identity.outputs.version }}
        run: |
          gh release download "v$VERSION" --repo "$GITHUB_REPOSITORY"             --pattern greatping.tgz --pattern release.json --pattern SHA256SUMS             --dir "$RUNNER_TEMP/candidate"
      - shell: bash
        env:
          VERSION: ${{ steps.identity.outputs.version }}
          SOURCE: ${{ steps.identity.outputs.source }}
        run: node scripts/release.mjs verify "$RUNNER_TEMP/candidate" "$VERSION" "$SOURCE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/candidate/
          if-no-files-found: error
          retention-days: 14

  package:
    name: Installed CLI (${{ matrix.os }}, Node ${{ matrix.node }})
    needs: build
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: ['22.20.0', '24']
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source || github.sha }}
          persist-credentials: false
      # Unix suites import source helpers to inspect state and simulate a phone.
      # Prepare those locked test dependencies on the build runtime. The CLI
      # under test is still installed separately from the downloaded archive;
      # package-smoke asserts that installation has no workspace protocol/tooling.
      - if: runner.os != 'Windows'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - if: runner.os != 'Windows'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - if: runner.os != 'Windows'
        run: pnpm install --frozen-lockfile --ignore-scripts
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.artifact-name }}
          path: ${{ runner.temp }}/candidate
      - shell: bash
        run: |
          version=$(node -p "require('./apps/cli/package.json').version")
          node scripts/release.mjs verify "$RUNNER_TEMP/candidate" "$version" "$(git rev-parse HEAD)"
      - if: runner.os != 'Windows'
        shell: bash
        env:
          GREATPING_TEST_PAIRING_FIXTURE: ${{ runner.temp }}/candidate/fixtures/pairing-fetch.mjs
        run: node apps/cli/test/package-smoke.mjs "$RUNNER_TEMP/candidate/greatping.tgz"
  platforms:
    needs: build
    uses: ./.github/workflows/cli-platforms.yml
    with:
      source: ${{ inputs.source }}
      artifact-name: ${{ inputs.artifact-name }}
