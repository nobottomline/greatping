version: 2
updates:
  # This is a generated mirror. Accepted updates are applied upstream; direct
  # merges here would be overwritten by the next export.
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      compatible-dependencies:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 2
    groups:
      actions:
        patterns: ['*']
